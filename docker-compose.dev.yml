# Development only: runs "npm run dev" on the local sources, with hot reload.
# The database comes from floraccess-database: start its docker-compose.dev.yml first,
# it creates the floraccess-net network joined here.

services:
  floraccess-api:
    image: node:24-alpine
    working_dir: /app
    env_file: .env
    environment:
      # Same default value as in the docker-compose.dev.yml of floraccess-database
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ./:/app/
    command: sh -c "cd /app && npm run dev"
    networks:
      - floraccess-net
    ports:
      - ${APP_PORT:-}:80
    user: "1800:1800"
    tmpfs:
      - /tmp:exec,nosuid,nodev

networks:
  floraccess-net:
    name: floraccess-net
    external: true
